<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkyFrame</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>📷 InkyFrame</h1>
            <p>Upload photos and display them on your e-ink screen</p>
            <div id="status-indicator" class="status-idle">
                <span class="status-dot"></span>
                <span id="status-text">Display: Idle</span>
            </div>
        </header>

        <!-- Upload Section -->
        <section class="upload-section">
            <div id="dropzone" class="dropzone">
                <div class="dropzone-content">
                    <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    <p class="dropzone-text">Drag & drop photos here</p>
                    <p class="dropzone-subtext">or click to browse</p>
                    <input type="file" id="file-input" accept="image/jpeg,image/jpg,image/png,image/bmp,image/webp"
                        multiple hidden>
                </div>
                <div id="upload-progress" class="upload-progress hidden">
                    <div class="progress-bar">
                        <div id="progress-fill" class="progress-fill"></div>
                    </div>
                    <p id="progress-text">Uploading...</p>
                </div>
            </div>
        </section>

        <!-- Gallery Section -->
        <section class="gallery-section">
            <div class="section-header">
                <h2>Photo Gallery</h2>
                <span id="photo-count" class="photo-count">0 photos</span>
            </div>
            <div id="gallery" class="gallery">
                <div class="empty-state">
                    <p>No photos yet. Upload your first photo above!</p>
                </div>
            </div>
        </section>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden">
        <span id="toast-message"></span>
    </div>

    <!-- Preview Modal -->
    <div id="preview-modal" class="modal hidden">
        <div class="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <img id="preview-image" src="" alt="Preview">
            <div class="modal-actions">
                <button id="display-btn" class="btn btn-primary">Display on Inky</button>
                <button id="delete-btn" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>

</html>
