[project]
name = "inkyframe"
version = "0.1.0"
description = "Web server for uploading and displaying photos on Inky e-ink displays"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "pillow>=10.2.0",
    "pydantic>=2.5.0",
    "aiofiles>=23.2.1",
    "numpy>=1.26.0",
    "httpx>=0.26.0",
    "python-dateutil>=2.8.2",
]
